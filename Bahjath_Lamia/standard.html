<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Required</title>
    <style>
        /* Base styles for the overlay */
        .payment-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Dark semi-transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensures it sits on top of all other content */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Styles for the modal box */
        .payment-modal {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* Typography */
        .payment-modal h2 {
            margin-top: 0;
            color: #333333;
            font-size: 24px;
        }

        .payment-modal p {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Primary Call to Action Button */
        .pay-btn {
            display: inline-block;
            background-color: #0066cc;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.3s ease;
            width: 80%;
            box-sizing: border-box;
        }

        .pay-btn:hover {
            background-color: #0052a3;
        }

        /* Secondary Link */
        .secondary-link {
            display: block;
            margin-top: 15px;
            color: #777777;
            text-decoration: none;
            font-size: 14px;
        }

        .secondary-link:hover {
            text-decoration: underline;
            color: #333333;
        }
        
        /* Optional Lock Icon */
        .icon-lock {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Main Website Content would go here -->
    
    <!-- Payment Required Modal -->
    <div class="payment-overlay">
        <div class="payment-modal">
            <div class="icon-lock">🔒</div>
            <h2>License Activation Required</h2>
            <p>Your evaluation period for this website template has expired. To continue using this template and unlock all features, please complete your payment.</p>
            
            <!-- Replace "#" with your actual payment gateway link (e.g., Stripe, PayPal) -->
            <a href="#" class="pay-btn">Make a Payment</a>
            
            <!-- Optional: Link for users who already have a license key -->
            <a href="#" class="secondary-link">I already have a license key</a>
        </div>
    </div>

</body>
</html>
